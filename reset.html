<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現場アイソメ を最新にする</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; background: #0B1220; color: #E8EEF6;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .box { max-width: 520px; width: 100%; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    p { font-size: 17px; line-height: 1.6; color: #9AAECA; margin: 0 0 12px; }
    #status {
      font-size: 18px; color: #E8EEF6; background: #1E2838; border: 1px solid #2C3A4E;
      border-radius: 12px; padding: 16px; margin: 16px 0;
    }
    #detail { font-size: 14px; color: #9AAECA; white-space: pre-wrap; }
    a.btn {
      display: block; text-align: center; text-decoration: none;
      min-height: 72px; line-height: 72px; border-radius: 12px;
      background: #4ADE80; color: #06210F; font-size: 17px; font-weight: 700;
      margin-top: 16px;
    }
    .note { font-size: 14px; color: #9AAECA; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>現場アイソメ を最新にします</h1>
    <p>端末に残っている古い版を消します。<strong>図面のデータは消えません。</strong></p>
    <div id="status">古い版を消しています…</div>
    <div id="detail"></div>
    <a class="btn" id="open" href="./">アプリを開く</a>
    <p class="note">
      自動で切り替わらないときは、上のボタンを押してください。<br>
      ホーム画面に追加している場合は、そのアイコンからも新しい版で開きます。
    </p>
  </div>

  <script>
    // 古い Service Worker とキャッシュだけを消す。
    // **IndexedDB（描いた図面）は触らない。**
    //
    // このファイルは新しい名前なので、古い Service Worker のキャッシュに存在せず、
    // 必ずネットワークから取られる。だから「古い版に閉じ込められた端末」からでも実行できる。
    (async function () {
      var status = document.getElementById('status');
      var detail = document.getElementById('detail');
      var lines = [];

      function log(t) {
        lines.push(t);
        detail.textContent = lines.join('\n');
      }

      try {
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          log('見つかった Service Worker: ' + regs.length + ' 件');
          for (var i = 0; i < regs.length; i++) {
            await regs[i].unregister();
          }
          if (regs.length) log('→ 解除しました');
        }

        if (window.caches) {
          var keys = await caches.keys();
          log('見つかったキャッシュ: ' + (keys.length ? keys.join(', ') : 'なし'));
          for (var j = 0; j < keys.length; j++) {
            await caches.delete(keys[j]);
          }
          if (keys.length) log('→ 削除しました');
        }

        status.textContent = '完了しました。アプリを開き直します…';
      } catch (e) {
        status.textContent = '一部消せませんでした。下のボタンから開いてください。';
        log('エラー: ' + e);
      }

      setTimeout(function () {
        location.replace('./?fresh=' + Date.now());
      }, 1200);
    })();
  </script>
</body>
</html>
