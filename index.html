<!DOCTYPE html>
<html lang="ja">
<head>
  <base href="/iso-draw-app/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="現場でアイソメ図を描き、寸法と切寸を出して SketchUp へ渡す。完全オフライン。">
  <meta name="theme-color" content="#0B1220">

  <!-- ホーム画面に入れたときの見え方（iOS/Android 共通） -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="現場アイソメ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>現場アイソメ</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0B1220; }
    /* 起動までの数秒が真っ白だと「壊れた」と思われるので、下地と表示を出す */
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; color: #94A3B8;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px;
    }
  </style>
</head>
<body>
  <div id="boot">現場アイソメを読み込んでいます…</div>

  <script>
    // 端末内のデータ（図面）をブラウザに消させない。
    // 容量が逼迫したとき IndexedDB は黙って捨てられることがある。
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist();
    }

    // ------------------------------------------------------------------
    // オフライン用 Service Worker の登録と更新
    //
    // **必ず毎回 register() を呼ぶ。**
    // 「既に動いていれば呼ばない」にしたら、更新のきっかけごと消えて
    // 端末が古い版を掴んだまま何日も直らなくなった（2026-08-19 実機）。
    // 圏外では失敗するが、それは catch して黙らせるだけでよい。
    //
    // 新しい SW が有効になったら **その場で読み込み直す**。
    // 待っていると、直したはずの画面が現場に出てこない。
    // ------------------------------------------------------------------
    if ('serviceWorker' in navigator) {
      var reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (reloading) return;
        reloading = true;
        window.location.reload();
      });

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          // 起動のたびに新しい版が無いか確かめる（電波がある時だけ成功する）
          reg.update().catch(function () {});
        }).catch(function () {
          // 圏外。すでに入っている版で動くので何もしない
        });
      });
    }

    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
